<h2>Reset your Miss Elanor password</h2>
<p>Someone asked to reset the password for {{ .Email }}.</p>
<p>Tap the button below to choose a new password. The link works once and expires after an hour.</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
     style="display:inline-block;padding:12px 20px;background:#8f5f6b;color:#ffffff;border-radius:10px;text-decoration:none;font-weight:600">
    Choose a new password
  </a>
</p>
<p>If you did not ask for this, you can ignore this email. Your password will not change.</p>
